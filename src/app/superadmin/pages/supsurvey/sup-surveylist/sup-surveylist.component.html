<div class="row ">
  <div class="col ">
    <!-- <h3 class="font-weight-bold" style="color: #70c4fe;">All Surveys</h3> -->
  </div>
    <div class="col  d-flex justify-content-end align-self-center mb-2">
      <button class="p-2 rounded button-color text-white  border-0" (click)="openCreateCoupon()">Create Coupon</button>
      <!-- <a class="btn btn-outline-primary ms-2" [routerLink]="['/superadmin/sup-survey/create-coupon']">Open Coupon Route</a> -->
    </div>

</div>
<section class="" style="height: 100%; padding-bottom: 5%; position: relative">
  <div *ngIf="!isLoading">
    <div class="row table-row row-head gx-0">
      <div class="col">Coupoun name</div>
      <!-- <div class="col">Survey description</div> -->
      <div class="col">Coupoun type </div>      <div class="col">Value</div>
      <div class="col">Currency</div>
      <div class="col">Logo</div>      <!-- <div class="col ">Status</div> -->
      <!-- <div class="col">Add question</div> -->
      <div class="col">Action</div>
    </div>
    <div class="tableCointainer" *ngIf="surveyList?.length>0">
      <div class="row gx-0 table-row row-body px-0 "
        *ngFor="let item of surveyList | paginate: { itemsPerPage: itemPerPage, currentPage: page, totalItems: totalItems }" style="cursor: pointer;">
        <div class="col" (click)="ondetails(item?.id,item?.tableName)">{{item?.survey_name}} </div>
        <!-- <div class="col">
        <div class="material">
          <div class="col"> {{item?.survey_description | titlecase }}</div>
        </div>
      </div> -->
        <div class="col">
          {{item?.survey_Type}}
        </div>
        <div class="col">
          {{item?.value}}
        </div>
        <div class="col">
          {{item?.currency}}
        </div>
        <div class="col">
          <span *ngIf="item?.logo" class="badge badge-info">{{item?.logo}}</span>
          <span *ngIf="!item?.logo" class="text-muted">-</span>
        </div>
        <div class="col"> <button mat-icon-button [matMenuTriggerFor]="menu" class="ellipsis-button"
            [disabled]="item.tableName==='static_survey'">
            <mat-icon class="ellipsis-icon">more_vert</mat-icon>
          </button>
          <mat-menu #menu="matMenu" class="custom-menu rounded-lg">
            <button mat-menu-item (click)="editSurvey(item?.id)">
              <mat-icon>edit</mat-icon>
              <span>Edit</span>
            </button>
            <button mat-menu-item (click)="deleteSurvey(item)">
              <mat-icon>delete</mat-icon>
              <span>Delete</span>
            </button>
            <!-- <button mat-menu-item (click)="openPopupQuestion(item.id)">
                  <mat-icon>comment</mat-icon>
                  <span>Assign question</span>
                </button> -->

          </mat-menu>
        </div>
      </div>
      <div class="text-end my-4" style="font-weight: 300 !important; font-size: 13px">
        <pagination-controls (pageChange)="pageChangeEvent($event)" [maxSize]="5"></pagination-controls>
      </div>
    </div>
  </div>
  <div class="text-center my-5">
    <i *ngIf="isLoading" class="fa fa-spinner fa-spin" style="font-size:64px;color: #70c4fe;"></i>
  </div>
  <!-- <div class="tableContainer" *ngIf="surveyList?.length == 0">
    <span class="text-danger">No data found</span>
  </div> -->
  <div class="text-center unavailability" *ngIf="surveyList?.length <= 0">
    No data available
  </div>
</section>

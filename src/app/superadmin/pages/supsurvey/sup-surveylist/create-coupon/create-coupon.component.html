<div class="create-coupon-dialog">
  <h2 class="title">Create Coupon</h2>
  <form [formGroup]="couponForm" (ngSubmit)="submit()">
    <section class="section">
      <h4>🏢 Company Details</h4>
      <div class="row">
        <div class="col">
          <label>Brand Name</label>
          <select formControlName="companyId" class="form-control">
            <option *ngFor="let c of companies" [value]="c.id">{{ c.name }}</option>
          </select>
        </div>
        <div class="col">
          <label>Coupon Poster</label>
          <input type="file" (change)="onPosterChange($event)" accept="image/*" class="form-control" />
        </div>
      </div>
    </section>

    <section class="section">
      <h4>🎟 Coupon Details</h4>
      <div class="row">
        <div class="col">
          <label>Coupon Title</label>
          <input formControlName="title" class="form-control" />
        </div>
        <div class="col">
          <label>Coupon Code</label>
          <div class="d-flex">
            <input formControlName="code" [readonly]="!manualCode" class="form-control" />
            <button type="button" class="btn btn-outline-secondary ms-2" (click)="generateCode()">Generate</button>
            <button type="button" class="btn btn-link ms-2" (click)="toggleManual()">{{ manualCode ? 'Auto' : 'Manual' }}</button>
          </div>
        </div>
      </div>

      <div class="row mt-2">
        <div class="col">
          <label>Coupon Type</label>
          <select formControlName="couponType" class="form-control">
            <option value="Gift Card">Gift Card</option>
            <option value="Discount">Discount</option>
          </select>
        </div>
        <div class="col">
          <label>Discount Type</label>
          <select formControlName="discountType" class="form-control">
            <option>Percentage</option>
            <option>Flat Amount</option>
          </select>
        </div>
        <div class="col">
          <label>Discount Value</label>
          <input type="number" formControlName="discountValue" class="form-control" />
        </div>
        <div class="col">
          <label>Minimum Purchase Amount</label>
          <input type="number" formControlName="minPurchase" class="form-control" />
        </div>
      </div>
    </section>

    <section class="section">
      <h4>📅 Validity</h4>
      <div class="row">
        <div class="col">
          <label>Start Date</label>
          <input type="date" formControlName="startDate" class="form-control" />
        </div>
        <div class="col">
          <label>Expiry Date</label>
          <input type="date" formControlName="expiryDate" class="form-control" />
        </div>
      </div>
    </section>

    <!-- Recipient Details removed per spec -->

    <div class="actions mt-3 text-end">
      <button type="button" class="btn btn-secondary me-2" (click)="cancel()">Cancel</button>
      <button type="submit" class="btn btn-primary" [disabled]="couponForm.invalid">Create Coupon</button>
    </div>
  </form>
</div>
